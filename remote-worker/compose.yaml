services:
  remote-worker:
    build:
      context: ..
      dockerfile: remote-worker/Dockerfile
    image: everything-remote-worker:local
    container_name: everything-remote-worker
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_HOST: 127.0.0.1
      WORKER_PORT: 8788
    # Host networking is required so the worker binds only to host loopback,
    # and so app containers' published loopback ports remain reachable to it.
    network_mode: host
    # Docker socket access is effectively host-level privilege. Use a dedicated
    # Linux host and set DOCKER_GID to the host socket's numeric group ID.
    group_add:
      - "${DOCKER_GID:-998}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
