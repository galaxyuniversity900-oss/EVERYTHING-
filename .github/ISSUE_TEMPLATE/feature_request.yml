name: Feature request
description: Suggest a concrete user-facing improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who has this problem and what blocks them?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior, not only the UI.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Device and resource constraints
      description: Mention low-memory, bandwidth, privacy, or cost constraints.
    validations:
      required: false
