name: Ollama End-to-End Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0"

permissions:
  contents: read

concurrency:
  group: ollama-e2e-smoke
  cancel-in-progress: true

jobs:
  local-inference:
    name: Pull a small model and verify real chat
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure an isolated test environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          AI_API_ENABLED=true
          AI_ALLOW_INTERNAL_HTTP=true
          AI_DEFAULT_PROVIDER=ollama
          AI_PROVIDERS_JSON='[{"id":"ollama","name":"CI Ollama","protocol":"openai-compatible","baseUrl":"http://ollama:11434/v1","model":"qwen2.5:0.5b","capabilities":["chat"]}]'
          OLLAMA_MODEL=qwen2.5:0.5b
          OLLAMA_MEMORY_LIMIT=3g
          OLLAMA_CPUS=2.0
          OLLAMA_CONTEXT_LENGTH=2048
          OLLAMA_KEEP_ALIVE=1m
          OLLAMA_NUM_PARALLEL=1
          OLLAMA_MAX_LOADED_MODELS=1
          OLLAMA_NO_CLOUD=true
          AUTH_PASSWORD=
          COOKIE_SECURE=false
          TRUSTED_HOSTS=
          EOF
          docker compose --profile local-ai config --quiet

      - name: Start workspace and Ollama
        run: docker compose --profile local-ai up -d

      - name: Wait for workspace health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/everything-health.json; then
              break
            fi
            sleep 2
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync("/tmp/everything-health.json", "utf8"));
            if (data.status !== "ok") process.exit(1);
          '

      - name: Wait for model pull and verify provider connectivity
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 180); do
            if docker compose exec -T ollama ollama list | grep -Fq 'qwen2.5:0.5b'; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          curl --fail --silent -X POST http://127.0.0.1:8787/api/ai/providers/check \
            -H 'content-type: application/json' \
            --data '{"providerId":"ollama"}' > /tmp/provider-check.json
          node --input-type=module -e '
            import fs from "node:fs";
            const d = JSON.parse(fs.readFileSync("/tmp/provider-check.json", "utf8"));
            if (d.ok !== true || d.modelListed !== true || d.model !== "qwen2.5:0.5b") process.exit(1);
          '
          docker compose exec -T ollama ollama list

      - name: Generate a real response using local model weights
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/ollama-chat.json --write-out '%{http_code}' \
            --max-time 180 \
            -X POST http://127.0.0.1:8787/api/ai/chat \
            -H 'content-type: application/json' \
            --data '{"providerId":"ollama","task":"chat","messages":[{"role":"user","content":"Reply with a short greeting and state that local model inference works."}]}')
          test "$status" = "200"
          node --input-type=module -e '
            import fs from "node:fs";
            const d = JSON.parse(fs.readFileSync("/tmp/ollama-chat.json", "utf8"));
            if (typeof d.content !== "string" || d.content.trim().length < 1) process.exit(1);
            if (d.providerId !== "ollama" || d.model !== "qwen2.5:0.5b") process.exit(1);
            console.log("Live local inference verified:", d.model, "content characters:", d.content.length);
          '

      - name: Show logs if the test fails
        if: failure()
        run: |
          docker compose logs --no-color everything ollama ollama-model-init || true

      - name: Stop test services
        if: always()
        run: docker compose --profile local-ai down --remove-orphans
