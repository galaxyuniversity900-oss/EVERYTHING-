name: CI

on:
  push:
    branches: ["main", "foundation/**", "phase-2/**", "phase-3/**", "phase-7/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          node --check remote-worker/server.mjs
          node --check src/security/auth.mjs
          node --check src/registry.mjs
          node --check src/ai/openai-compatible.mjs
          node --check src/ai/provider-registry.mjs
          node --check src/ai/provider-adapters.mjs
          node --check src/ai/router.mjs
          node --check src/runtime/capabilities.mjs
          node --check src/runtime/remote-provider.mjs
          node --check src/mcp/client.mjs
          node --check public/auth.js
          node --check public/app.js
          node --check public/ai.js
          node --check public/runtime.js
          node --check public/device-profile.js
          node --check public/mcp.js
          node --check public/remote.js
          node --check public/sw.js
          node --check public/workspace.js
          node --check public/workspace-core.js
      - name: Smoke-test HTTP APIs
        shell: bash
        run: |
          set -euo pipefail
          PORT=18787 node server.mjs > /tmp/everything-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18787/api/health > /tmp/everything-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18787/api/auth/status | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const payload = JSON.parse(input);
            if (payload.required !== false || payload.authenticated !== true) process.exit(1);
          '
          curl --fail --silent http://127.0.0.1:18787/api/health | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            if (JSON.parse(input).status !== "ok") process.exit(1);
          '
          curl --fail --silent http://127.0.0.1:18787/manifest.webmanifest | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            if (JSON.parse(input).name !== "EVERYTHING- Workspace") process.exit(1);
          '
          curl --fail --silent http://127.0.0.1:18787/workspace.css > /tmp/everything-workspace.css
          test -s /tmp/everything-workspace.css
          curl --fail --silent http://127.0.0.1:18787/api/apps | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const payload = JSON.parse(input);
            if (!Array.isArray(payload.apps) || payload.apps.length < 10) process.exit(1);
            if (!payload.apps.some((app) => app.hosted === false)) process.exit(1);
          '
          curl --fail --silent http://127.0.0.1:18787/api/ai/providers | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            if (JSON.parse(input).enabled !== false) process.exit(1);
          '
          curl --fail --silent http://127.0.0.1:18787/api/mcp/status | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            if (JSON.parse(input).configured !== false) process.exit(1);
          '
          curl --fail --silent 'http://127.0.0.1:18787/api/runtime/capabilities?wasm=1&webgpu=0' | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const payload = JSON.parse(input);
            if (!payload.capabilities || payload.remoteSessionAdapterImplemented !== true || payload.remoteRuntimeConfigured !== false) process.exit(1);
          '
          curl --fail --silent http://127.0.0.1:18787/api/runtime/remote/status | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            if (JSON.parse(input).configured !== false) process.exit(1);
          '
          AI_CHECK_STATUS=$(curl --silent --output /tmp/everything-ai-check-disabled.json --write-out '%{http_code}' -X POST http://127.0.0.1:18787/api/ai/providers/check -H 'content-type: application/json' --data '{"providerId":"default"}')
          test "$AI_CHECK_STATUS" = "503"
          AI_STATUS=$(curl --silent --output /tmp/everything-ai-disabled.json --write-out '%{http_code}' -X POST http://127.0.0.1:18787/api/ai/chat -H 'content-type: application/json' --data '{"messages":[{"role":"user","content":"test"}]}')
          test "$AI_STATUS" = "503"
          MCP_STATUS=$(curl --silent --output /tmp/everything-mcp-disabled.json --write-out '%{http_code}' -X POST http://127.0.0.1:18787/api/mcp/tools/call -H 'content-type: application/json' --data '{"name":"echo","arguments":{},"confirmed":true}')
          test "$MCP_STATUS" = "503"
          REMOTE_STATUS=$(curl --silent --output /tmp/everything-remote-disabled.json --write-out '%{http_code}' -X POST http://127.0.0.1:18787/api/runtime/remote/sessions -H 'content-type: application/json' --data '{"appId":"editor","confirmed":true}')
          test "$REMOTE_STATUS" = "503"
          ORIGIN_SCHEME_STATUS=$(curl --silent --output /tmp/everything-origin-scheme.json --write-out '%{http_code}' -X POST http://127.0.0.1:18787/api/mcp/tools/call -H 'Origin: https://127.0.0.1:18787' -H 'content-type: application/json' --data '{"name":"echo","arguments":{},"confirmed":true}')
          test "$ORIGIN_SCHEME_STATUS" = "403"
          HOST_STATUS=$(curl --silent --output /tmp/everything-host-blocked.json --write-out '%{http_code}' -X POST http://127.0.0.1:18787/api/mcp/tools/call -H 'Host: attacker.example' -H 'content-type: application/json' --data '{"name":"echo","arguments":{},"confirmed":true}')
          test "$HOST_STATUS" = "403"
          AUTH_PASSWORD=ci-test-password COOKIE_SECURE=false PORT=18788 node server.mjs > /tmp/everything-auth-server.log 2>&1 &
          AUTH_PID=$!
          trap 'kill "$SERVER_PID" "$AUTH_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18788/api/auth/status > /tmp/everything-auth-status.json; then
              break
            fi
            sleep 1
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const payload = JSON.parse(fs.readFileSync("/tmp/everything-auth-status.json", "utf8"));
            if (payload.required !== true || payload.authenticated !== false) process.exit(1);
          '
          AUTH_BLOCKED=$(curl --silent --output /tmp/everything-auth-blocked.json --write-out '%{http_code}' http://127.0.0.1:18788/api/apps)
          test "$AUTH_BLOCKED" = "401"
          BAD_LOGIN=$(curl --silent --output /tmp/everything-bad-login.json --write-out '%{http_code}' -X POST http://127.0.0.1:18788/api/auth/login -H 'content-type: application/json' --data '{"password":"wrong-password"}')
          test "$BAD_LOGIN" = "401"
          GOOD_LOGIN=$(curl --silent --output /tmp/everything-good-login.json --write-out '%{http_code}' -c /tmp/everything-cookies.txt -X POST http://127.0.0.1:18788/api/auth/login -H 'content-type: application/json' --data '{"password":"ci-test-password"}')
          test "$GOOD_LOGIN" = "200"
          AUTHORIZED_API=$(curl --silent --output /tmp/everything-authorized.json --write-out '%{http_code}' -b /tmp/everything-cookies.txt http://127.0.0.1:18788/api/apps)
          test "$AUTHORIZED_API" = "200"
          curl --fail --silent -b /tmp/everything-cookies.txt -X POST http://127.0.0.1:18788/api/auth/logout > /tmp/everything-logout.json
          LOGGED_OUT_API=$(curl --silent --output /tmp/everything-logged-out.json --write-out '%{http_code}' http://127.0.0.1:18788/api/apps)
          test "$LOGGED_OUT_API" = "401"
          node --input-type=module -e '
            import { createServer } from "node:http";
            const server = createServer((req, res) => {
              res.setHeader("content-type", "application/json");
              if (req.url !== "/v1/models" || req.headers.authorization !== "Bearer ci-provider-secret") {
                res.writeHead(401); res.end(JSON.stringify({ error: "unauthorized" })); return;
              }
              res.end(JSON.stringify({ data: [{ id: "ci-model" }] }));
            });
            server.listen(18789, "127.0.0.1");
          ' > /tmp/everything-model-server.log 2>&1 &
          MODEL_PID=$!
          AI_API_ENABLED=true AI_MAX_CONCURRENT_REQUESTS=1 OPENAI_BASE_URL=http://127.0.0.1:18789/v1 OPENAI_MODEL=ci-model OPENAI_API_KEY=ci-provider-secret PORT=18790 node server.mjs > /tmp/everything-ai-check-server.log 2>&1 &
          AI_PID=$!
          trap 'kill "$SERVER_PID" "$AUTH_PID" "$MODEL_PID" "$AI_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18790/api/ai/providers > /tmp/everything-configured-providers.json; then break; fi
            sleep 1
          done
          curl --fail --silent -X POST http://127.0.0.1:18790/api/ai/providers/check -H 'content-type: application/json' --data '{"providerId":"default"}' > /tmp/everything-provider-check.json
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/everything-provider-check.json", "utf8"));
            if (result.ok !== true || result.modelListed !== true || result.providerId !== "default" || result.model !== "ci-model") process.exit(1);
            if (JSON.stringify(result).includes("ci-provider-secret")) process.exit(1);
          '
