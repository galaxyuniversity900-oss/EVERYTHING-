services:
  everything:
    build:
      context: .
      dockerfile: Dockerfile
    image: everything-platform:local
    container_name: everything-platform
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: everything-ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama-data:/root/.ollama
    # Intentionally no published host port; only same-Compose-network services may access it.
    expose:
      - "11434"
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-3g}
    cpus: ${OLLAMA_CPUS:-2.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["local-ai"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ollama pull \"${OLLAMA_MODEL}\""]

volumes:
  ollama-data:
